<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fallback only — every route renders its own <SEO> component (react-helmet-async),
       which sets title/description/robots/canonical/Open Graph/Twitter tags dynamically
       per page. Helmet appends rather than replacing static tags already in this file, so
       duplicating any of those here would produce two conflicting tags (this is exactly
       what happened with a static "index, follow" robots tag silently duplicating a page's
       "noindex, nofollow" one). This title only shows before the JS bundle loads. -->
  <title>Becof Organic Chemicals | Sustainable Agricultural Solutions</title>
  <meta name="author" content="Becof Organic Chemicals Limited" />

  <!-- Structured Data (site-wide identity — not page-specific, safe to be global) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Becof Organic Chemicals Limited",
    "url": "https://www.becoforganicchemicals.com",
    "logo": "https://www.becoforganicchemicals.com/images/becof-logo.png",
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "email": "info@becoforganic.com"
    }
  }
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
